<div id="top"></div>
<app-menu-title></app-menu-title>

@if (featuredPost; as featured) {
  <div id="latest" class="container__articles">
    <div class="articles__main">
      <app-big-card
        [Id]="featured.id"
        [photoCover]="featured.photoCover"
        [cardTitle]="featured.title"
        [cardDescription]="featured.description"
        [author]="featured.author"
        [publishedAt]="featured.publishedAt"
        [readTime]="featured.readTime"
      >
      </app-big-card>
    </div>

    <div class="articles__others">
      @for (post of secondaryPosts; track post.id; let i = $index) {
        <app-small-card
          [attr.id]="getSectionAnchor(post, i)"
          [Id]="post.id"
          [cardTitle]="post.title"
          [photoCover]="post.photoCover"
          [author]="post.author"
          [publishedAt]="post.publishedAt"
          [readTime]="post.readTime"
        >
        </app-small-card>
      } @empty {
        <p class="empty-state">Nenhum post secundário encontrado.</p>
      }
    </div>
  </div>
} @else {
  <div class="container__articles">
    <p class="empty-state">Nenhum post em destaque encontrado.</p>
  </div>
}
